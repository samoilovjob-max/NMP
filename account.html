<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Личный кабинет — Northern Magical Place</title>
  <link rel="icon" href="images/logo-mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header scrolled" id="header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Northern Magical Place">
        <img class="brand-logo" src="images/logo-mark.jpg" alt="Northern Magical Place" width="64" height="64" />
        <span class="brand-text">
          <span>Northern</span>
          <span>Magical Place</span>
        </span>
      </a>
      <nav class="nav" id="nav">
        <a href="index.html#catalog">Изделия</a>
        <a href="account.html" class="active">Личный кабинет</a>
        <a href="checkout.html">Корзина</a>
        <a href="buyers.html">Доставка</a>
      </nav>
      <div class="header-actions">
        <a class="icon-btn" href="checkout.html" aria-label="Корзина">
          <svg viewBox="0 0 24 24"><path d="M6 7h15l-1.5 9h-12z"/><path d="M6 7 5 3H2"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>

        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Меню"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-hero compact">
      <div class="container">
        <div class="eyebrow">Кабинет</div>
        <h1>Личный кабинет</h1>
        <p class="lead">Статусы заказов и трекинг СДЭК в одном месте</p>
      </div>
    </section>

    <section class="section" style="padding-top:2rem;">
      <div class="container account-layout" id="accountRoot"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-simple">
      <img class="footer-logo" src="images/logo-full.jpg" alt="Northern Magical Place" />
      <p>© 2026 Northern Magical Place</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
  <script src="js/account.js"></script>
